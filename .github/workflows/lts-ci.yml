name: My Custom LTS Kernel CI (x86_64 Only + Binder) # Renamed

on:
  # Keep original trigger if desired
  push:
    tags:
      - 'linux-wsl-lts-6.*.[0-9]+'
  # ADDED: Manual trigger
  workflow_dispatch:
    inputs:
      tag_to_build:
        description: 'Specify the Nevuly git tag to build (e.g., linux-wsl-lts-6.1.80)'
        required: true

run-name: My Custom Build (x86_64+Binder) ${{ github.event.inputs.tag_to_build || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nevuly/nevuly-dev-base:arch
      options: --privileged
    outputs:
      BUILT_KERNEL_VERSION: ${{ steps.get-version.outputs.KERNEL_VERSION }}
      X86_IMAGE_SHA: ${{ steps.gen-sha-256.outputs.X86_IMAGE_SHA }}

    env:
      ARCH_SHORT: x86
      ARCH_LONG: x86_64
      IMAGE_NAME_BASE: bzImage
      IMAGE_NAME: bzImage-x86_64 # Set directly

    steps:
      - name: Trust this directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout source code for tag '${{ github.event.inputs.tag_to_build }}'
        uses: actions/checkout@v4
        with:
          repository: Nevuly/WSL2-Linux-Kernel-Rolling-LTS
          ref: ${{ github.event.inputs.tag_to_build }}
          fetch-depth: 0

      - name: Configure Kernel with Binder/Ashmem/KVM (Built-in)
        run: |
          echo "Copying base config: arch/x86/configs/config-wsl-x86"
          cp arch/x86/configs/config-wsl-x86 .config

          echo "Enabling Binder/Ashmem features as built-in..."
          scripts/config --set-val CONFIG_ANDROID_BINDER_IPC y
          scripts/config --set-val CONFIG_ANDROID_BINDERFS y
          scripts/config --set-val CONFIG_ASHMEM y

          echo "Ensuring KVM is built-in (AMD)..."
          scripts/config --set-val CONFIG_KVM y
          scripts/config --set-val CONFIG_KVM_AMD y # AMD Enabled
          scripts/config --set-val CONFIG_VHOST y
          scripts/config --set-val CONFIG_VHOST_NET y

          echo "Finalizing config..."
          make oldconfig # Accept defaults
          echo "Config finalized."

      - name: Build WSL2 LTS kernel (x86)
        run: |
          echo "Starting x86 build..."
          mkdir -p $GITHUB_WORKSPACE/output
          make -j$(echo `nproc` + 1 | bc)
          cp arch/x86/boot/bzImage $GITHUB_WORKSPACE/output/${IMAGE_NAME} # Copy to output dir
          echo "Build finished, image copied to output/${IMAGE_NAME}"

      - name: Get Kernel Version
        id: get-version
        run: |
          KERNEL_VERSION=$(make kernelrelease)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "Detected kernel version: $KERNEL_VERSION"

      # REMOVED Module/Tarball/VHDX steps

      - name: Generate SHA-256 Checksum (x86 Kernel Only)
        id: gen-sha-256
        run: |
          echo "Generating checksum for x86 kernel image..."
          cd $GITHUB_WORKSPACE/output

          echo "Calculating sha256 for ${IMAGE_NAME}..."
          sha256sum "${IMAGE_NAME}" > "${IMAGE_NAME}.sha256"

          # Output only x86 image SHA
          read -r sha rest < "${IMAGE_NAME}.sha256" && echo "X86_IMAGE_SHA=$sha" >> $GITHUB_OUTPUT
          echo "Checksum generation done."

      # Upload kernel image ONLY
      - name: Upload kernel Image Artifact (x86)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-kernel-artifact # Use env var directly
          path: |
            ${{ github.workspace }}/output/${{ env.IMAGE_NAME }} 
            ${{ github.workspace }}/output/${{ env.IMAGE_NAME }}.sha256
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success'
    permissions:
      contents: write
    env:
      X86_IMAGE_SHA: ${{ needs.build.outputs.X86_IMAGE_SHA }}
      BUILT_KERNEL_VERSION: ${{ needs.build.outputs.BUILT_KERNEL_VERSION }}
      IMAGE_NAME: bzImage-x86_64 # Define IMAGE_NAME here too for consistency

    steps:
      - name: Download x86 kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-kernel-artifact # Use env var directly
          path: final_release_files/

      - name: List downloaded files for debugging
        run: ls -lR final_release_files/

      # Release kernel image ONLY
      - name: Release Kernel (x86)
        uses: softprops/action-gh-release@v2
        with:
          name: Custom Build (x86+Binder Built-in) - ${{ env.BUILT_KERNEL_VERSION }} (Tag ${{ github.event.inputs.tag_to_build }})
          tag_name: custom-x86-binder-builtin-${{ env.BUILT_KERNEL_VERSION }}-${{ github.run_id }} # Unique tag
          body: |
            **Custom WSL2 Kernel Build (x86_64 Only)**

            Based on Nevuly's source tag: `${{ github.event.inputs.tag_to_build }}`
            Built kernel version: `${{ env.BUILT_KERNEL_VERSION }}`

            **Includes added support BUILT-IN:**
            * Android Binder IPC (`CONFIG_ANDROID_BINDER_IPC=y`)
            * Android Binderfs (`CONFIG_ANDROID_BINDERFS=y`)
            * Android Ashmem (`CONFIG_ASHMEM=y`)
            * KVM (AMD)

            **NOTE:** Docker networking features were NOT explicitly forced built-in in this build, relying on the base Nevuly config. No separate module package (`tar.gz`/`.vhdx`) is needed or provided.

            **WARNING**
            This is a custom build from a fork. Use at your own risk.

            **Hash Information (x86_64)**
            | File Name | SHA-256 Checksum |
            |:--------------:|:------:|
            | bzImage-x86_64 | `${{ env.X86_IMAGE_SHA }}` |

            **(Installation: Update `.wslconfig` kernel= path, `wsl --shutdown`, start WSL)**

          # CORRECTED: Removed comment from files pattern
          files: |
            final_release_files/* 
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          prerelease: true
